name: Bug report
description: The harness reported the wrong result or failed to run
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full agent-trials command you ran. Remove any API keys.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The result lines, and err.txt from the run folder if relevant.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, agent and version
      placeholder: macOS 15, opencode 2.2.0
    validations:
      required: true
